name: Deploy CorpX Documentation

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: corpx-documentation-deployment
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint:all

      - name: Run URL checker
        env:
          URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}
        run: |
          node script/url-checker.js \
            -t "$URL_CHECKER_TIMEOUT" \
            -d src/posts

  build:
    name: Build
    runs-on: ubuntu-latest

    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          PATH_PREFIX: /${{ github.event.repository.name }}/
        run: npm run eleventy:prod

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site


  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs:
      - test
      - build

    if: >
      always() &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch'
      )

    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          if [ "$DEPLOYMENT_OUTCOME" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi

          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          fi

          gh issue create \
            --repo "$REPOSITORY" \
            --title "$DATE - Deployment: $STATUS" \
            --body "URL: $SITE_URL"